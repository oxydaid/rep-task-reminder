services:
  whatsapp-reminder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-reminder
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/reminders.db
      - WA_DB_PATH=/app/data/whatsapp.db
      - BACKUP_DIR=/app/data/backups
      - STATIC_DIR=/app/frontend/dist
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Asia/Jakarta}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
